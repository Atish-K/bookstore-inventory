<dialog #dialog class="dialog" (close)="closed.emit()" (click)="onDialogClick($event)">
  <div class="dialog-header">
    <span class="cover" [style.background]="cover()"></span>
    <div class="heading">
      <p class="eyebrow">Update stock</p>
      <h2>{{ book().title }}</h2>
      <p class="isbn">ISBN {{ book().isbn }}</p>
    </div>
    <button type="button" class="icon-btn ghost" (click)="close()" aria-label="Close">
      <app-icon name="close" [size]="18" />
    </button>
  </div>

  <div class="dialog-body">
    <div class="current">
      <span>Current stock</span>
      <strong>{{ book().stock }} {{ book().stock === 1 ? 'unit' : 'units' }}</strong>
    </div>

    <div class="field">
      <label for="quantity">How many copies?</label>
      <div class="quantity">
        <button type="button" (click)="step(-1)" [disabled]="!!saving()" aria-label="Decrease quantity">
          <app-icon name="minus" [size]="16" />
        </button>
        <input
          id="quantity"
          type="number"
          min="1"
          step="1"
          autofocus
          [ngModel]="quantity()"
          (ngModelChange)="quantity.set($event)"
          [disabled]="!!saving()"
        />
        <button type="button" (click)="step(1)" [disabled]="!!saving()" aria-label="Increase quantity">
          <app-icon name="plus" [size]="16" />
        </button>
      </div>
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">
        <app-icon name="alert" [size]="18" />
        <div class="alert-body">
          <p class="alert-title">Could not update stock</p>
          <p>{{ error() }}</p>
        </div>
      </div>
    }
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn" (click)="save('remove')" [disabled]="!!saving()">
      <app-icon name="minus" [size]="16" />
      {{ saving() === 'remove' ? 'Removing...' : 'Remove ' + (quantity() ?? '') }}
    </button>
    <button type="button" class="btn btn-primary" (click)="save('add')" [disabled]="!!saving()">
      <app-icon name="plus" [size]="16" />
      {{ saving() === 'add' ? 'Adding...' : 'Add ' + (quantity() ?? '') }}
    </button>
  </div>
</dialog>
